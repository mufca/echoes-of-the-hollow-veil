import java.nio.file.Files
import java.nio.file.Path

plugins {
    id 'java'
    id "de.undercouch.download" version "5.4.0"
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    if (enableGraalNative == 'true') {
        implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
    }

    implementation "org.tinylog:tinylog-api:$tinylogVersion"
    implementation "org.tinylog:tinylog-impl:$tinylogVersion"
    testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junitVersion"
    testImplementation "org.assertj:assertj-core:$assertjVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
    testImplementation "org.awaitility:awaitility:$awaitilityVersion"
    testImplementation "commons-io:commons-io:$apacheCommonsIO"
}

sourceSets.main.resources.srcDirs = ["assets"]

tasks.named("build") {
    dependsOn(":generateLicenseReport")
}

test {
    useJUnitPlatform()
    forkEvery = 1
}

// --- Location's index generation

List<File> assetDirectories = [
        file("assets/locations"),
        file("src/test/resources/locations"),
        file("assets/characters")
]

def generateLocationIndexes = tasks.register('generateLocationIndexes') {
    doLast {
        assetDirectories.each { File directory ->
            if (!directory.exists()) {
                println "[!] Warning ${directory} doesnt exist, skipping generation of index.txt"
                return
            }

            List<String> jsonFiles = []
            Path dirPath = directory.toPath()

            Files.walk(dirPath)
                    .filter { Files.isRegularFile(it) && it.toString().toLowerCase().endsWith(".json") }
                    .forEach { Path filePath -> jsonFiles << dirPath.relativize(filePath).toString().replace("\\", "/") }

            if (!jsonFiles.isEmpty()) {
                File indexFile = new File(directory, "index.txt")
                indexFile.text = jsonFiles.join("\n")
                println "[ok] Generated ${jsonFiles.size()} entries to ${indexFile}"
            }
        }
    }
}

// --- Ink setup and script compilation

boolean isWindows = System.getProperty("os.name").toLowerCase().contains("win")
boolean isMac = System.getProperty("os.name").toLowerCase().contains("mac")
String osName = isWindows ? "windows" : (isMac ? "mac" : "linux")

def inkDir = layout.buildDirectory.dir("ink-compiler")

def downloadInklecate = tasks.register('downloadInklecate', Download) {
    src "https://github.com/inkle/ink/releases/download/${inkVersion}/inklecate_${osName}.zip"
    dest layout.buildDirectory.file("temp/inklecate.zip")
    overwrite false
}

def setupInklecate = tasks.register('setupInklecate', Copy) {
    dependsOn downloadInklecate
    from { zipTree(downloadInklecate.get().dest) }
    into inkDir

    doLast {
        if (!isWindows) {
            File binary = inkDir.get().file("inklecate").asFile
            binary.setExecutable(true)
        }
    }
}

def generateInkIncludes = tasks.register('generateInkIncludes') {
    group = "ink"
    description = "Generates main<Dir>.ink files for each subdirectory in assets/ink"

    doLast {
        File inkAssetsDir = project.file("assets/ink")
        File[] subDirs = inkAssetsDir.listFiles()?.findAll { File f -> f.isDirectory() && f.name != "compiled" } ?: []

        subDirs.each { File dir ->
            String dirName = dir.name
            String capitalizedName = dirName.substring(0, 1).toUpperCase() + dirName.substring(1)
            File mainFile = new File(inkAssetsDir, "main${capitalizedName}.ink")
            def inkFiles = project.fileTree(dir).include("**/*.ink")

            String includeContent = inkFiles.collect { File file ->
                String relativePath = inkAssetsDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                return "INCLUDE ${relativePath}"
            }.join("\n")

            mainFile.text = "// Auto-generated include file\n" + includeContent
            println "[*] Generated: ${mainFile.name}"
        }
    }
}

def compileInk = tasks.register('compileInk') {
    group = "ink"
    dependsOn(generateInkIncludes, setupInklecate)

    doLast {
        File inkAssetsDir = project.file("assets/ink")
        File outputDir = project.file("assets/ink/compiled")
        boolean isWin = System.getProperty("os.name").toLowerCase().contains("win")
        File inkBinary = project.layout.buildDirectory.dir("ink-compiler").get().file(
                isWin ? "inklecate.exe" : "inklecate"
        ).asFile

        if (!outputDir.exists()) {
            outputDir.mkdirs()
        }

        inkAssetsDir.listFiles()?.findAll { File f -> f.name.endsWith(".ink") }?.each { File file ->
            println "[*] Compiling: ${file.name}"

            providers.exec {
                commandLine inkBinary.absolutePath, "-o",
                        "${outputDir.path}/${file.name.replace('.ink', '.json')}",
                        file.absolutePath
            }.result.get()
        }
    }
}

tasks.named("processResources") {
    dependsOn(generateLocationIndexes, compileInk)
}

tasks.named("processTestResources") {
    dependsOn(generateLocationIndexes, compileInk)
}